name: Android CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------
  # Job 1: Lint, Static Analysis & Code Quality Gate
  # -------------------------------------------------------------
  lint:
    name: Code Quality & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Run Android Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 7

  # -------------------------------------------------------------
  # Job 2: Unit Testing
  # -------------------------------------------------------------
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

  # -------------------------------------------------------------
  # Job 3: Build & Package (Debug + Release APKs + AAB)
  # -------------------------------------------------------------
  build:
    name: Build & Sign APKs
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Debug & Release APKs
        run: ./gradlew assembleDebug assembleRelease bundleRelease --stacktrace

      - name: Prepare Output Artifacts
        run: |
          mkdir -p output/
          cp app/build/outputs/apk/debug/app-debug.apk output/colab-debug.apk
          cp app/build/outputs/apk/release/app-release.apk output/colab-release.apk
          if [ -f app/build/outputs/bundle/release/app-release.aab ]; then
            cp app/build/outputs/bundle/release/app-release.aab output/colab-release.aab
          fi
          echo "Output files ready:"
          ls -lh output/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: colab-debug-apk
          path: output/colab-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: colab-release-apk
          path: output/colab-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android App Bundle (AAB) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: colab-release-aab
          path: output/colab-release.aab
          if-no-files-found: ignore
          retention-days: 14

  # -------------------------------------------------------------
  # Job 4: Automated Continuous Deployment / GitHub Releases
  # -------------------------------------------------------------
  deploy:
    name: Continuous Deployment & GitHub Releases
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Debug APK
        uses: actions/download-artifact@v4
        with:
          name: colab-debug-apk
          path: release-assets/

      - name: Download Signed Release APK
        uses: actions/download-artifact@v4
        with:
          name: colab-release-apk
          path: release-assets/

      - name: Download AAB Bundle
        uses: actions/download-artifact@v4
        with:
          name: colab-release-aab
          path: release-assets/
        continue-on-error: true

      - name: Generate Checksums
        run: |
          cd release-assets/
          sha256sum * > SHA256SUMS.txt
          echo "=== Artifact SHA256 Checksums ==="
          cat SHA256SUMS.txt

      - name: Continuous Pre-Release Deployment (Rolling on 'main')
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "rolling"
          name: "Colab Android Client (Latest Build)"
          body: |
            ## Automated Continuous Deployment Build
            Automated pipeline build from commit `${{ github.sha }}` on branch `main`.
            
            ### Included Packages:
            - **`colab-debug.apk`**: Installable debug build with full logging
            - **`colab-release-signed.apk`**: Production release build signed and ready for installation
            - **`app-release.aab`**: Android App Bundle format
            - **`SHA256SUMS.txt`**: Cryptographic integrity checksums
          draft: false
          prerelease: true
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Official Tagged Release (On 'v*')
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Colab Android Client ${{ github.ref_name }}"
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
