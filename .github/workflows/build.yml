name: Android CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------
  # Job 1: Lint, Static Analysis & Code Quality Gate
  # -------------------------------------------------------------
  lint:
    name: Code Quality & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          validate-wrappers: false

      - name: Accept Android SDK Licenses
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Ensure Signing Keystore
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              tr -d '\r\n' < debug.keystore.base64 | base64 -d > debug.keystore
            else
              keytool -genkeypair -v -keystore debug.keystore \
                -storetype PKCS12 -storepass android -keypass android \
                -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Run Android Lint
        run: gradle lintDebug --stacktrace

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 7

  # -------------------------------------------------------------
  # Job 2: Unit Testing
  # -------------------------------------------------------------
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          validate-wrappers: false

      - name: Accept Android SDK Licenses
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Ensure Signing Keystore
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              tr -d '\r\n' < debug.keystore.base64 | base64 -d > debug.keystore
            else
              keytool -genkeypair -v -keystore debug.keystore \
                -storetype PKCS12 -storepass android -keypass android \
                -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --stacktrace

  # -------------------------------------------------------------
  # Job 3: Build & Package (Debug + Release APKs + AAB)
  # -------------------------------------------------------------
  build:
    name: Build & Sign APKs
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          validate-wrappers: false

      - name: Accept Android SDK Licenses
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Ensure Signing Keystore
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              tr -d '\r\n' < debug.keystore.base64 | base64 -d > debug.keystore
            else
              keytool -genkeypair -v -keystore debug.keystore \
                -storetype PKCS12 -storepass android -keypass android \
                -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Build Release APK
        run: gradle assembleRelease --stacktrace

      - name: Build Release App Bundle (AAB)
        run: gradle bundleRelease --stacktrace

      - name: Prepare Output Artifacts
        run: |
          mkdir -p output/
          cp app/build/outputs/apk/debug/app-debug.apk output/colab-debug.apk
          cp app/build/outputs/apk/release/app-release.apk output/colab-release.apk
          if [ -f app/build/outputs/bundle/release/app-release.aab ]; then
            cp app/build/outputs/bundle/release/app-release.aab output/colab-release.aab
          fi
          echo "Output files ready:"
          ls -lh output/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: colab-debug-apk
          path: output/colab-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: colab-release-apk
          path: output/colab-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android App Bundle (AAB) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: colab-release-aab
          path: output/colab-release.aab
          if-no-files-found: ignore
          retention-days: 14

  # -------------------------------------------------------------
  # Job 4: Automated Continuous Deployment / GitHub Releases
  # -------------------------------------------------------------
  deploy:
    name: Continuous Deployment & GitHub Releases
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Debug APK
        uses: actions/download-artifact@v4
        with:
          name: colab-debug-apk
          path: release-assets/

      - name: Download Signed Release APK
        uses: actions/download-artifact@v4
        with:
          name: colab-release-apk
          path: release-assets/

      - name: Download AAB Bundle
        uses: actions/download-artifact@v4
        with:
          name: colab-release-aab
          path: release-assets/
        continue-on-error: true

      - name: Generate Checksums
        shell: bash
        run: |
          cd release-assets/
          rm -f SHA256SUMS.txt
          shopt -s nullglob
          files=(colab-*)
          if [ ${#files[@]} -gt 0 ]; then
            sha256sum "${files[@]}" > SHA256SUMS.txt
          fi
          echo "=== Artifact SHA256 Checksums ==="
          cat SHA256SUMS.txt

      - name: Continuous Pre-Release Deployment (Rolling on 'main')
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "rolling"
          name: "Colab Android Client (Latest Build)"
          body: |
            ## Automated Continuous Deployment Build
            Automated pipeline build from commit `${{ github.sha }}` on branch `main`.
            
            ### Included Packages:
            - **`colab-debug.apk`**: Installable debug build with full logging
            - **`colab-release.apk`**: Production release build signed and ready for installation
            - **`colab-release.aab`**: Android App Bundle format
            - **`SHA256SUMS.txt`**: Cryptographic integrity checksums
          draft: false
          prerelease: true
          make_latest: false
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Official Tagged Release (On 'v*')
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Colab Android Client ${{ github.ref_name }}"
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
